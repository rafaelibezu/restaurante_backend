spring.application.name=sistema-restaurante

spring.datasource.url=jdbc:sqlserver://localhost;databaseName=SistemaGestionRestauranteDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=restaurante_user
spring.datasource.password=Restaurante123*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=8080